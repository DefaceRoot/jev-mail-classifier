[project]
name = "jev-mail-classifier"
version = "0.1.0"
description = "Classify your inbox with Jev (TypeSafe's System One model) — label and sort your inbox, config-driven."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "imapclient>=3.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
jev-mail = "jev_mail.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jev_mail*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
